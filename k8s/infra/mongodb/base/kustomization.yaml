# Base configuration - includes all infrastructure components
# Components organized by service
resources:
  # Infrastructure manifests
  - db-secret.yaml
  - mongodb.yaml
  - scc.yaml

commonLabels:
  app: medi-hoot-db

patchesJson6902:
  - target:
      group: rbac.authorization.k8s.io
      version: v1
      kind: RoleBinding
      name: system:openshift:scc:anyuid
    patch: |-
      - op: replace
        path: /subjects/0/namespace
        value: mongodb-dev
      - op: replace
        path: /subjects/1/namespace
        value: mongodb-dev
