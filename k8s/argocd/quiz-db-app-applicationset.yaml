apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: quiz-db-app
  namespace: openshift-gitops
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  generators:
  - list:
      elements:
      - env: dev
        variable_path: k8s/helm/quiz-db-app
        targetRevision: main
      - env: prod
        variable_path: k8s/helm/quiz-db-app
        targetRevision: main
  template:
    metadata:
      name: quiz-app-{{.env}}
      namespace: openshift-gitops
    spec:
      project: default
      source:
        repoURL: https://github.com/Carlos-ZRM/rag-agent-med-hoot.git
        targetRevision: HEAD
        path: k8s/helm/quiz-db-app
        helm:
          valueFiles:
            - '{{.env}}-values.yaml'
      destination:
        server: https://kubernetes.default.svc
        namespace: quiz-db-app-{{.env}}
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=true