apiVersion: v1
kind: Service
metadata:
  name: {{ include "quiz-db-app.fullname" . }}-deployment
  labels:
    {{- include "quiz-db-app.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port | default 8000 }}
      targetPort: http
      protocol: TCP
      name: http
  selector:
    {{- include "quiz-db-app.selectorLabels" . | nindent 4 }}
