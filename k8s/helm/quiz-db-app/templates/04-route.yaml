kind: Route
apiVersion: route.openshift.io/v1
metadata:
  name: {{ include "quiz-db-app.fullname" . }}-route
  labels:
    {{- include "quiz-db-app.labels" . | nindent 4 }}
spec:
  to:
    kind: Service
    name: {{ include "quiz-db-app.fullname" . }}-deployment
    weight: 100
  port:
    targetPort:  {{ .Values.service.port | default 8000 }}
  tls:
    termination: edge
    insecureEdgeTerminationPolicy: Redirect
  wildcardPolicy: None