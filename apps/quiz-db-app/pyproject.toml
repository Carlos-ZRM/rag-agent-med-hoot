[project]
name = "health-kahoot"
version = "0.1.0"
description = "Healthcare Kahoot-style quiz app with true/false questions"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "jinja2>=3.1.0",
    "python-multipart>=0.0.9",
    "motor>=3.5.0",
    "couchbase>=4.2.0",
]

[tool.poetry]
packages = [{include = "app"}]

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.poetry.scripts]
start = "app.main:run"
